services:
  gateway:
    build: .
    container_name: rsshub-gateway
    restart: unless-stopped
    environment:
      GATEWAY_SECRET_FILE: /run/secrets/gateway_secret
      GATEWAY_CACHE_DIR: /var/cache/rsshub-gateway
      GATEWAY_CACHE_MAX_BYTES: "5368709120"
      GATEWAY_MEDIA_CACHE_MAX_FILE_BYTES: "33554432"
      GATEWAY_VIDEO_CACHE_MAX_FILE_BYTES: "268435456"
      GATEWAY_IMAGE_VARIANT_CONCURRENCY: "2"
      GATEWAY_IMAGE_VARIANT_MAX_SOURCE_BYTES: "33554432"
      GATEWAY_HTML_BROTLI_MIN_BYTES: "4096"
      GATEWAY_HTML_BROTLI_QUALITY: "4"
      EH_PREFETCH_CONCURRENCY: "8"
      EH_PREFETCH_MAX_CONCURRENCY: "36"
      EH_MEDIA_PREFETCH_CONCURRENCY: "6"
      EH_MEDIA_PREFETCH_MIN_CONCURRENCY: "3"
      EH_MEDIA_PREFETCH_MAX_CONCURRENCY: "48"
      EH_MEDIA_PREFETCH_PER_ORIGIN: "48"
      EH_MEDIA_FOREGROUND_WARM_COUNT: "8"
      EH_MEDIA_FOREGROUND_WARM_CONCURRENCY: "8"
      EH_FIRST_PAINT_COUNT: "1"
      EH_COLD_START_ENABLED: "true"
      EH_FIRST_DETAIL_BUDGET_MS: "1200"
      GATEWAY_MEDIA_BROWSER_CACHE_SECONDS: "300"
      EGRESS_CONTROLLER_URL: http://127.0.0.1:9090
      EGRESS_PROXY_BASE_URL: http://127.0.0.1
      EGRESS_LANE_COUNT: "12"
      EGRESS_SESSION_LANE_COUNT: "12"
      EGRESS_SESSION_LISTENER_BASE_PORT: "7921"
      SESSION_AFFINITY_FILE: /var/cache/rsshub-gateway/session-affinity.json
      EGRESS_MIN_CONCURRENCY_PER_LANE: "3"
      EGRESS_MAX_CONCURRENCY_PER_LANE: "6"
      EGRESS_MAX_TOTAL_CONCURRENCY: "48"
      EGRESS_REFRESH_INTERVAL_MS: "60000"
      EGRESS_PROBE_URL: https://e-hentai.org/
      EGRESS_PROBE_TIMEOUT_MS: "5000"
      EGRESS_PROBE_CACHE_MS: "300000"
      EGRESS_PUBLIC_HOSTS: "linux.do,kemono.su,kemono.cr,coomer.su,coomer.st,fanbox.cc,skeb.jp,uraaka-joshi.com,sehuatang.net,jable.tv,missav.ws,missav.ai,missav.com,missav.live,javbus.com,javdb.com,airav.wiki,airav.io,ggjav.com,ggjav.tv,wnacg.com,chikubi.jp,hanime1.me,dlsite.com,dlsite.jp,nodeseek.com,v2ex.com,acg.rip,bangumi.tv,bgm.tv,nyaa.si,share.dmhy.org,dmhy.org,mangadex.org,api.mangadex.org,steampowered.com,store.steampowered.com,steamstatic.com,epicgames.com,bilibili.com,hdslb.com,weibo.com,weibo.cn,sinaimg.cn,zhihu.com,zhimg.com,github.com"
      GATEWAY_BROWSER_FETCH_HOSTS: "javbus.com,javdb.com,airav.wiki,airav.io,jable.tv,missav.ws,missav.ai,missav.com,missav.live,ggjav.com,ggjav.tv,wnacg.com,wnacg.org,chikubi.jp,skeb.jp,fanbox.cc,kemono.su,kemono.cr,coomer.su,coomer.st,sehuatang.net,linux.do,hanime1.me,dlsite.com,dlsite.jp,nodeseek.com,v2ex.com,acg.rip,bangumi.tv,bgm.tv,nyaa.si,share.dmhy.org,dmhy.org,mangadex.org,api.mangadex.org,steampowered.com,store.steampowered.com,steamstatic.com,epicgames.com,bilibili.com,hdslb.com,weibo.com,weibo.cn,sinaimg.cn,zhihu.com,zhimg.com,github.com"
      RSSHUB_URL: http://rsshub:1200
      SOURCE_CONFIG_FILE: /app/config/sources.json
      GATEWAY_LEASE_PROXY_PORT: "1301"
      # Dispatcher 路由注册表（缺省=纯透明增强网关）
      # 疑难站点增强模式（单容器）：sidecar 默认开启，独立进程；关闭设 false
      # 平台 feed 预热（后台定时异步预抓取，100% 缓存命中，实现 ms 级超快访问）
      GATEWAY_FEED_PREFETCH_PATHS: "/linuxdo/latest,/iwara/users/zzzwen/video,/ehviewer/ranking/day,/javbus/home,/javdb/home,/ggjav/home,/airav/home,/missav/new,/jable/new-release,/netflav,/91porn,/skeb/art,/fanbox/official,/wnacg/home,/sehuatang/103,/kemono/posts,/coomer/posts,/chikubi/home,/hanime1/latest,/dlsite/ranking/maniax/day,/nodeseek/latest,/v2ex/topics/latest,/acgrip/latest,/nyaa/recent,/dmhy/latest,/bangumi/calendar/today,/steam/specials,/mangadex/latest,/epic/free,/bilibili/ranking,/weibo/search/hot,/zhihu/hot,/github/trending"
      GATEWAY_FEED_PREFETCH_INTERVAL_MS: "300000"
      GATEWAY_FEED_PREFETCH_CONCURRENCY: "3"
      GATEWAY_CACHE_TTL_RSS: "1800"
      # 通用增强线路引擎：单基座内集中维护全部站点（RSSHub 万物皆可 RSS 理念），彻底告别臃肿的独立 Sidecar 进程
      GATEWAY_UNIVERSAL_ENHANCER: "true"
      # 保留无头浏览器渲染驱动（按需为所有需要 JS 执行或抗盾的通用路由提供渲染服务）
      GATEWAY_BROWSER_RENDER: "true"
      GATEWAY_BROWSER_RENDER_URL: "http://127.0.0.1:8004"
      # 全部 32 个站点已全面迁移至通用线路内置统一引擎，全部子进程关闭，消除 30+ 个 Node 进程与端口占用
      GATEWAY_SIDECAR_IWARA: "false"
      GATEWAY_SIDECAR_EH: "false"
      GATEWAY_SIDECAR_GGJAV: "false"
      GATEWAY_SIDECAR_AIRAV: "false"
      GATEWAY_SIDECAR_MISSAV: "false"
      GATEWAY_SIDECAR_JABLE: "false"
      GATEWAY_SIDECAR_JAVBUS: "false"
      GATEWAY_SIDECAR_JAVDB: "false"
      GATEWAY_SIDECAR_COOMER: "false"
      GATEWAY_SIDECAR_WNACG: "false"
      GATEWAY_SIDECAR_FANBOX: "false"
      GATEWAY_SIDECAR_URAAKA: "false"
      GATEWAY_SIDECAR_SEHUATANG: "false"
      GATEWAY_SIDECAR_CHIKUBI: "false"
      GATEWAY_SIDECAR_LINUXDO: "false"
      GATEWAY_SIDECAR_SKEB: "false"
      GATEWAY_SIDECAR_KEMONO: "false"
      GATEWAY_SIDECAR_HANIME1: "false"
      GATEWAY_SIDECAR_DLSITE: "false"
      GATEWAY_SIDECAR_NODESEEK: "false"
      GATEWAY_SIDECAR_V2EX: "false"
      GATEWAY_SIDECAR_ACGRIP: "false"
      GATEWAY_SIDECAR_NYAA: "false"
      GATEWAY_SIDECAR_DMHY: "false"
      GATEWAY_SIDECAR_BANGUMI: "false"
      GATEWAY_SIDECAR_STEAM: "false"
      GATEWAY_SIDECAR_MANGADEX: "false"
      GATEWAY_SIDECAR_EPIC: "false"
      GATEWAY_SIDECAR_BILIBILI: "false"
      GATEWAY_SIDECAR_WEIBO: "false"
      GATEWAY_SIDECAR_ZHIHU: "false"
      GATEWAY_SIDECAR_GITHUB: "false"
    ports:
      - 127.0.0.1:1300:1300
      - 1301:1301
    volumes:
      - ./config/mihomo:/root/.config/mihomo
      - ./config/gateway-cache:/var/cache/rsshub-gateway
      - ./config/sources.json:/app/config/sources.json:ro
      - ./secrets/gateway_secret:/run/secrets/gateway_secret:ro
      - ./gateway-routes.yaml:/app/gateway-routes.yaml:ro
      - ./src:/app/src
      - ./browser-render:/app/browser-render
      - ./sidecar:/app/sidecar
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
    networks:
      1panel-network:
        aliases:
          - rsshub-gateway

  # 疑难站点增强模式采用单容器：fetcher-iwara / fetcher-eh 由容器 entrypoint
  # 按 GATEWAY_SIDECAR_IWARA / GATEWAY_SIDECAR_EH 环境变量以独立进程拉起，
  # 与网关基座进程隔离，无需额外容器。多容器形态可另建服务 command: ["fetcher-iwara"]。

networks:
  1panel-network:
    external: true
