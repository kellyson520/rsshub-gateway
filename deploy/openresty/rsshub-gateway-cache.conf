proxy_cache_path /var/cache/openresty/rsshub-gateway
    levels=1:2
    keys_zone=rsshub_gateway_images:32m
    inactive=7d
    max_size=5g
    use_temp_path=off;

map $upstream_http_content_type $rsshub_gateway_skip_image_cache {
    default 1;
    ~*^image/ 0;
}

map "$http_range:$sent_http_content_type" $rsshub_gateway_media_cache_control {
    default "no-store";
    ~*^:image/ "public, max-age=86400";
}
