# RSSHub Gateway Mihomo configuration example.
# Copy to config/mihomo/config.yaml and fill in your subscription URL.
# The gateway expects EGRESS_LANE_01..12 (public pool) and SESSION_LANE_01..12
# (credentialed pool) groups plus one mixed listener per lane:
#   7901-7912  public lanes  (EGRESS_SESSION_LISTENER_BASE_PORT is not used for these)
#   7921-7932  session lanes (EGRESS_SESSION_LISTENER_BASE_PORT, default 7921)
mixed-port: 7890
allow-lan: true
bind-address: 0.0.0.0
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

proxy-providers:
  subscription:
    type: http
    url: https://example.invalid/subscription?token=replace-me
    path: ./providers/subscription.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://t.me
      interval: 600

proxy-groups:
  - name: AUTO
    type: url-test
    use: [subscription]
    url: https://t.me
    interval: 600
    tolerance: 100
  - name: PROXY
    type: select
    proxies: [AUTO, DIRECT]
  - name: PUBLIC
    type: load-balance
    strategy: round-robin
    use: [subscription]
    url: https://t.me
    interval: 60
  - name: STICKY
    type: url-test
    use: [subscription]
    url: https://t.me
    interval: 60
    tolerance: 100
  - name: EGRESS_LANE_01
    type: select
    use: [subscription]
  - name: EGRESS_LANE_02
    type: select
    use: [subscription]
  - name: EGRESS_LANE_03
    type: select
    use: [subscription]
  - name: EGRESS_LANE_04
    type: select
    use: [subscription]
  - name: EGRESS_LANE_05
    type: select
    use: [subscription]
  - name: EGRESS_LANE_06
    type: select
    use: [subscription]
  - name: EGRESS_LANE_07
    type: select
    use: [subscription]
  - name: EGRESS_LANE_08
    type: select
    use: [subscription]
  - name: EGRESS_LANE_09
    type: select
    use: [subscription]
  - name: EGRESS_LANE_10
    type: select
    use: [subscription]
  - name: EGRESS_LANE_11
    type: select
    use: [subscription]
  - name: EGRESS_LANE_12
    type: select
    use: [subscription]
  - name: SESSION_LANE_01
    type: select
    use: [subscription]
  - name: SESSION_LANE_02
    type: select
    use: [subscription]
  - name: SESSION_LANE_03
    type: select
    use: [subscription]
  - name: SESSION_LANE_04
    type: select
    use: [subscription]
  - name: SESSION_LANE_05
    type: select
    use: [subscription]
  - name: SESSION_LANE_06
    type: select
    use: [subscription]
  - name: SESSION_LANE_07
    type: select
    use: [subscription]
  - name: SESSION_LANE_08
    type: select
    use: [subscription]
  - name: SESSION_LANE_09
    type: select
    use: [subscription]
  - name: SESSION_LANE_10
    type: select
    use: [subscription]
  - name: SESSION_LANE_11
    type: select
    use: [subscription]
  - name: SESSION_LANE_12
    type: select
    use: [subscription]

listeners:
  - name: egress-lane-01
    type: mixed
    listen: 127.0.0.1
    port: 7901
    proxy: EGRESS_LANE_01
  - name: egress-lane-02
